name: "Continuous Integration & Security Gating"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write  # Required for Cosign keyless signing via OIDC
jobs:
  # ============================================================================
  # JOB 1: MATRIX UNIT & COMPATIBILITY TESTING
  # ============================================================================
  test:
    name: "Unit Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Python Runtime (${{ matrix.python-version }})"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute Pytest Suite"
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --tb=short

# ============================================================================
  # JOB 2: DEEP GIT HISTORY SECRET AUDIT (TRUFFLEHOG)
  # ============================================================================
  secret-scan:
    name: "TruffleHog Deep Secret Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Complete Git History"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Scan for Leaked Cryptographic Secrets"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # ============================================================================
  # JOB 3: STATIC FILESYSTEM & CONFIGURATION AUDIT
  # ============================================================================
  security-fs:
    name: "Filesystem & Docker Misconfig Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Run Trivy Config Scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "misconfig"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: "Install Cosign (Sigstore)"
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.8.1

      - name: "Sign Published Container Image (GHCR)"
        if: github.event_name != 'pull_request'
        run: |
          echo "Signing image with keyless OIDC identity..."
          cosign sign --yes "ghcr.io/${{ github.repository }}/fleet-telemetry:${{ steps.meta.outputs.version }}"

  # ============================================================================
  # JOB 4: HARDENED BUILD & DUAL-REGISTRY PUBLISH
  # ============================================================================
  build-and-publish:
    name: "Docker Build, Audit & Publish"
    needs: [test, secret-scan, security-fs]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Extract Docker Metadata & Tags"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/fleet-telemetry
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/fleet-telemetry', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: "Build Container Image Locally (For Auditing)"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: fleet-telemetry:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Verify Non-Root Security Context"
        run: |
          USER_ID=$(docker run --rm fleet-telemetry:${{ github.sha }} id -u)
          echo "Verified: Container runs as unprivileged UID: $USER_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "ERROR: Container runs as ROOT!"
            exit 1
          fi

      - name: "Scan Image for Vulnerabilities"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fleet-telemetry:${{ github.sha }}
          scan-type: "image"
          vuln-type: "library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: "Log in to GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Log in to Docker Hub"
        if: github.event_name != 'pull_request' && env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Publish Hardened Image to GHCR & Docker Hub"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha