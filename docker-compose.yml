services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: fleet_admin
      POSTGRES_PASSWORD: fleet_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleet-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_admin -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Application Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_NAME: fleet_db
      DB_USER: fleet_admin
      DB_PASSWORD: fleet_secure_pass
      DB_PORT: "5432"
    networks:
      - fleet-internal-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  fleet-internal-net:
    driver: bridge
    name: fleet-internal-net

volumes:
  postgres_data:
    name: fleet-postgres-data
