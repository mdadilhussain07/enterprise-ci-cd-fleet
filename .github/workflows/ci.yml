name: "Continuous Integration & Security Gating"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # JOB 1: CODE QUALITY & AUTOMATED TESTING
  # ============================================================================
  test:
    name: "Unit & Integration Tests"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Python Runtime"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute Pytest Suite"
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --tb=short

  # ============================================================================
  # JOB 2: STATIC SECURITY & SECRET LEAK AUDIT
  # ============================================================================
  security-fs:
    name: "Filesystem & Secret Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Run Trivy Secret & Config Scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "secret,misconfig"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  # ============================================================================
  # JOB 3: CONTAINER BUILD, AUDIT & MULTI-REGISTRY PUBLISH
  # ============================================================================
  build-and-publish:
    name: "Docker Build, Audit & Publish"
    needs: [test, security-fs]
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # Single unified metadata extraction step for all destination registries
      - name: "Extract Docker Metadata & Tags"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/fleet-telemetry
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: "Build Container Image Locally (For Auditing)"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: fleet-telemetry:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Verify Non-Root Security Context"
        run: |
          USER_ID=$(docker run --rm fleet-telemetry:${{ github.sha }} id -u)
          echo "Verified: Container runs as unprivileged UID: $USER_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "ERROR: Container runs as ROOT!"
            exit 1
          fi

      - name: "Scan Image for Vulnerabilities"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fleet-telemetry:${{ github.sha }}
          scan-type: "image"
          vuln-type: "library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      # Registry Target 1: GitHub Container Registry (GHCR)
      - name: "Log in to GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push verified artifact to configured registries
      - name: "Publish Hardened Image"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
